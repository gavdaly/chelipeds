name: Build, push, and publish ISO
on:
  push:
    branches: [main, feat/update-version-bootc]
  workflow_dispatch:
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chelipeds
  TAG: "44"
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Validate scripts and metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts -type f -print0 | xargs -0 -n1 bash -n
          find scripts -type f -print0 | xargs -0 shellcheck
          python3 -m json.tool bootc-config.json >/dev/null
          for unit in systemd/*.service systemd/*.timer; do
            grep -q '^\[Unit\]' "$unit"
            grep -q '^\[Service\]\|^\[Timer\]' "$unit"
          done
          for script in notify-update-on-login.sh install-flatpaks.sh update-tools.sh; do
            test -f "scripts/$script" || test -f "overlay/usr/local/bin/$script"
          done
          git diff --check
  build:
    runs-on: ubuntu-latest
    needs: validate
    environment: Actions
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          podman build -t "$image:$TAG" -t "$image:latest" .
          podman push "$image:$TAG"
          podman push "$image:latest"
      - name: Build bootable ISO
        run: |
          mkdir -p output
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$image:$TAG"
          sudo podman run --privileged --rm --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --rootfs ext4 --output /output "$image:$TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: chelipeds-iso-fedora-44
          path: output/**/*.iso
      - name: Prepare ISO checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          iso=$(find output -type f -name '*.iso' -print -quit)
          test -n "$iso"
          sha256sum "$iso" > "$iso.sha256"
          echo "ISO=$iso" >> "$GITHUB_ENV"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0
      - name: Sign ISO
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes "$ISO" --output-signature "$ISO.sig"
      - name: Upload ISO to Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_FORCE_PATH_STYLE: "true"
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone copyto --s3-no-check-bucket "$ISO" "r2:${R2_BUCKET}/iso/$(basename "$ISO")"
          rclone copyto --s3-no-check-bucket "$ISO.sha256" "r2:${R2_BUCKET}/iso/$(basename "$ISO").sha256"
          rclone copyto --s3-no-check-bucket "$ISO.sig" "r2:${R2_BUCKET}/iso/$(basename "$ISO").sig"
      - name: Upload signed release assets
        uses: actions/upload-artifact@v6
        with:
          name: chelipeds-iso-release-assets
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.sha256
            ${{ env.ISO }}.sig

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
      - name: Download signed release assets
        uses: actions/download-artifact@v6
        with:
          name: chelipeds-iso-release-assets
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "iso-44-${{ github.run_number }}" \
            release-assets/install.iso release-assets/install.iso.sha256 release-assets/install.iso.sig \
            --title "Chelipeds Fedora 44 ISO ${{ github.run_number }}" \
            --generate-notes
