name: Build, test, and publish ISO
on:
  push:
    branches: [main, '**']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
concurrency:
  group: chelipeds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chelipeds
  TAG: "44"
  BRANCH_TAG: ${{ github.ref_name }}-${{ github.sha }}
jobs:
  check-base-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - name: Inspect Fedora bootc base digest
        id: inspect
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          digest=$(skopeo inspect --format '{{.Digest}}' docker://quay.io/fedora/fedora-bootc:44)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Compare tracked base digest
        id: compare
        run: |
          current='${{ steps.inspect.outputs.digest }}'
          tracked=$(cat .github/base-image-digest)
          if [ "$current" = "$tracked" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fedora bootc:44 is unchanged at $current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Fedora bootc:44 changed from $tracked to $current"
          fi
  validate-shell:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Cache ShellCheck packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/apt
          key: shellcheck-ubuntu-${{ runner.os }}
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts -type f -print0 | xargs -0 -n1 bash -n
          find scripts -type f -print0 | xargs -0 shellcheck
  validate-metadata:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Validate metadata and units
        run: |
          python3 -m json.tool bootc-config.json >/dev/null
          for unit in systemd/*.service systemd/*.timer; do
            grep -q '^\[Unit\]' "$unit"
            grep -q '^\[Service\]\|^\[Timer\]' "$unit"
          done
          for script in notify-update-on-login.sh install-flatpaks.sh update-tools.sh; do
            test -f "scripts/$script" || test -f "overlay/usr/local/bin/$script"
          done
          git diff --check
  validate-containerfile:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Validate Containerfile syntax
        run: |
          grep -q '^FROM ' Containerfile
          grep -q 'fedora-bootc:' Containerfile
          grep -q '^COPY overlay/' Containerfile
  build-voxtype:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Cache Cargo dependencies and build output
        id: voxtype-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            voxtype-bin
          key: voxtype-v0.7.5-parakeet-${{ runner.os }}-${{ hashFiles('Containerfile') }}
          restore-keys: |
            voxtype-v0.7.5-parakeet-${{ runner.os }}-
      - name: Install Voxtype build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc libasound2-dev libclang-dev cmake libssl-dev pkg-config wtype wl-clipboard git
      - name: Compile Voxtype with Parakeet support
        if: steps.voxtype-cache.outputs.cache-hit != 'true'
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          cargo install --root "$PWD/voxtype-root" \
            --git https://github.com/peteonrails/voxtype.git \
            --tag v0.7.5 voxtype --features parakeet
          test -x voxtype-root/bin/voxtype
          cp voxtype-root/bin/voxtype voxtype-bin
      - name: Verify cached or compiled Voxtype
        run: test -x voxtype-bin
      - uses: actions/upload-artifact@v7
        with:
          name: voxtype-v0.7.5-parakeet
          path: voxtype-bin
  build-image:
    runs-on: ubuntu-latest
    needs: [check-base-image, validate-shell, validate-metadata, validate-containerfile, build-voxtype]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Download cached Voxtype binary
        uses: actions/download-artifact@v8
        with:
          name: voxtype-v0.7.5-parakeet
          path: .
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Cache Podman layers
        uses: actions/cache@v5
        with:
          path: /var/lib/containers/storage
          key: podman-${{ runner.os }}-${{ hashFiles('Containerfile', 'overlay/**', 'scripts/**', 'config/**') }}
          restore-keys: |
            podman-${{ runner.os }}-
      - name: Build image once and save artifact
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          branch_tag=$(echo "$BRANCH_TAG" | tr '/_' '--' | tr -cd '[:alnum:].-')
          sudo podman build --layers -t "$image:$branch_tag" .
          sudo podman save --format oci-archive -o chelipeds-image.tar "$image:$branch_tag"
      - uses: actions/upload-artifact@v7
        with:
          name: chelipeds-image
          path: chelipeds-image.tar
          compression-level: 0

  publish-image:
    runs-on: ubuntu-latest
    needs: build-image
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chelipeds-image
          path: .
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Load and publish image
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          branch_tag=$(echo "$BRANCH_TAG" | tr '/_' '--' | tr -cd '[:alnum:].-')
          sudo podman load -i chelipeds-image.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag "$image:$branch_tag" "$image:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            sudo podman tag "$image:$branch_tag" "$image:$TAG"
            sudo podman tag "$image:$branch_tag" "$image:latest"
          fi
          for tag in "$branch_tag" "sha-${GITHUB_SHA}"; do
            for attempt in 1 2 3; do
              sudo podman push "$image:$tag" && break
              test "$attempt" -lt 3 || exit 1
              sleep $((attempt * 10))
            done
          done
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            for tag in "$TAG" latest; do
              for attempt in 1 2 3; do
                sudo podman push "$image:$tag" && break
                test "$attempt" -lt 3 || exit 1
                sleep $((attempt * 10))
              done
            done
          fi

  build-iso:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chelipeds-image
          path: .
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Load and smoke test image
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          branch_tag=$(echo "$BRANCH_TAG" | tr '/_' '--' | tr -cd '[:alnum:].-')
          sudo podman load -i chelipeds-image.tar
          sudo podman run --rm "$image:$branch_tag" bootc status
      - name: Build bootable ISO
        run: |
          mkdir -p output
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          branch_tag=$(echo "$BRANCH_TAG" | tr '/_' '--' | tr -cd '[:alnum:].-')
          sudo podman run --privileged --rm --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --rootfs ext4 --output /output "$image:$branch_tag"
      - uses: actions/upload-artifact@v7
        with:
          name: chelipeds-iso-fedora-44
          path: output/**/*.iso
      - name: Prepare ISO checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          iso=$(find output -type f -name '*.iso' -print -quit)
          test -n "$iso"
          (cd "$(dirname "$iso")" && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          echo "ISO=$iso" >> "$GITHUB_ENV"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0
      - name: Sign ISO
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes "$ISO" --output-signature "$ISO.sig"
      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: chelipeds-iso-release-assets
          path: |
            output/**/*.iso
            output/**/*.iso.sha256
            output/**/*.iso.sig

  verify-iso:
    runs-on: ubuntu-latest
    needs: build-iso
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chelipeds-iso-release-assets
          path: release-assets
      - name: Verify ISO checksum and signature assets
        run: |
          iso=$(find release-assets -type f -name '*.iso' -print -quit)
          test -n "$iso"
          test -s "$iso.sha256"
          test -s "$iso.sig"
          (cd "$(dirname "$iso")" && sha256sum --check "$(basename "$iso").sha256")
          file "$iso" | grep -qi 'ISO 9660\|DOS/MBR boot sector'

  publish-r2:
    runs-on: ubuntu-latest
    needs: verify-iso
    if: github.ref == 'refs/heads/main'
    environment: Actions
    permissions:
      contents: read
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: chelipeds-iso-release-assets
          path: release-assets
      - name: Upload ISO to Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_FORCE_PATH_STYLE: "true"
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          curl -fsSL https://rclone.org/install.sh | sudo bash
          iso=$(find release-assets -type f -name '*.iso' -print -quit)
          test -n "$iso"
          for file in "$iso" "$iso.sha256" "$iso.sig"; do
            for attempt in 1 2 3; do
              rclone copyto --s3-no-check-bucket "$file" "r2:${R2_BUCKET}/iso/$(basename "$file")" && break
              test "$attempt" -lt 3 || exit 1
              sleep $((attempt * 10))
            done
          done

  release:
    runs-on: ubuntu-latest
    needs: verify-iso
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: chelipeds-iso-release-assets
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "iso-44-${{ github.run_number }}" \
            release-assets/install.iso.sha256 release-assets/install.iso.sig \
            --title "Chelipeds Fedora 44 ISO ${{ github.run_number }}" \
            --notes "The ISO is uploaded to Cloudflare R2. Download it from the configured R2 ISO endpoint and verify it with the attached SHA-256 checksum and Cosign signature." \
            --generate-notes
